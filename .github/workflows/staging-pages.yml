name: Deploy staging preview

on:
  push:
    branches:
      - codex/staging-digital-headquarters
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ark-of-bones-staging
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build staging site
        run: npm run build -- --base=/ark-of-bones/

      - name: Configure staging safeguards
        run: |
          routes=(
            events
            watch
            tables
            shop
            brands
            brands/domino-mother-fucker
            brands/big-six-bones
            about
            contact
            learn
            faq
            domino-mother-fucker
            big-six-bones
            videos-2
            merch
            merch-3
          )
          for route in "${routes[@]}"; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done
          cp dist/index.html dist/404.html
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload staging artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy staging preview
        id: deployment
        uses: actions/deploy-pages@v4
