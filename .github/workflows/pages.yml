name: Deploy Ark of Bones production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ark-of-bones-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Configure GitHub Pages routes
        run: |
          routes=(
            events
            watch
            official-play
            tables
            shop
            shop/archive
            brands
            brands/domino-mother-fucker
            brands/big-six-bones
            about
            around-the-table
            contact
            learn
            faq
            domino-mother-fucker
            big-six-bones
            home-live-soon
            events-1
            events-2
            events/event-one-dkrkk
            watch-1
            watch-2
            videos-2
            videos-2/watch-archives
            videos-2/v/sunday-nights-with-aob
            videos-2/v/aob-game-night
            videos-2/v/anywhere
            videos-2/v/who-is-aob
            videos-2/v/game-night
            merch
            merch-1
            merch-2
            merch-3
            merch/big-six-bones-merch
            merch/domino-mother-fucker-merch
            merch/p/ark-of-bones-embroidered-sweatshirt
            merch/p/long-sleeve-crew-neck
            merch/p/kkcizt5w74u864q22c2w175tajc3l9-g8wb7
            merch/p/kkcizt5w74u864q22c2w175tajc3l9
            merch/p/ark-of-bones-beanie-p3kd2
            merch/p/ark-of-bones-beanie
          )
          for route in "${routes[@]}"; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done
          cp dist/index.html dist/404.html
          printf 'www.arkofbones.com\n' > dist/CNAME

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy production site
        id: deployment
        uses: actions/deploy-pages@v5
